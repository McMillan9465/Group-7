<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Illustration of the Starlight Primary School building on a sunny day</title>
  <rect x="0" y="0" width="560" height="440" rx="28" fill="#EAF2FB"/>

  <!-- sun -->
  <g>
    <circle cx="468" cy="86" r="30" fill="#F0B03F"/>
    <g stroke="#F0B03F" stroke-width="6" stroke-linecap="round">
      <line x1="468" y1="34" x2="468" y2="46"/>
      <line x1="468" y1="126" x2="468" y2="138"/>
      <line x1="416" y1="86" x2="428" y2="86"/>
      <line x1="508" y1="86" x2="520" y2="86"/>
      <line x1="431" y1="49" x2="439" y2="57"/>
      <line x1="497" y1="115" x2="505" y2="123"/>
      <line x1="505" y1="49" x2="497" y2="57"/>
      <line x1="439" y1="115" x2="431" y2="123"/>
    </g>
  </g>

  <!-- clouds -->
  <g fill="#FFFFFF">
    <ellipse cx="120" cy="84" rx="46" ry="18"/>
    <ellipse cx="152" cy="72" rx="34" ry="15"/>
    <ellipse cx="88" cy="74" rx="28" ry="13"/>
    <ellipse cx="322" cy="52" rx="36" ry="14"/>
    <ellipse cx="350" cy="44" rx="24" ry="11"/>
  </g>

  <!-- birds -->
  <g stroke="#33415E" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M228 96 q9 -9 18 0 q9 -9 18 0"/>
    <path d="M266 124 q7 -7 14 0 q7 -7 14 0"/>
  </g>

  <!-- ground -->
  <path d="M0 358 Q140 338 280 352 T560 348 L560 412 Q560 440 532 440 L28 440 Q0 440 0 412 Z" fill="#D9ECDC"/>
  <path d="M0 396 Q160 384 320 392 T560 390 L560 412 Q560 440 532 440 L28 440 Q0 440 0 412 Z" fill="#CBE4D1"/>

  <!-- walkway -->
  <path d="M256 342 L304 342 L340 440 L220 440 Z" fill="#EBE1C9"/>

  <!-- trees -->
  <g>
    <rect x="64" y="286" width="14" height="56" rx="6" fill="#8B6748"/>
    <circle cx="71" cy="256" r="34" fill="#6FA873"/>
    <circle cx="46" cy="276" r="22" fill="#7FB681"/>
    <circle cx="96" cy="276" r="22" fill="#639D68"/>
  </g>
  <g>
    <rect x="470" y="300" width="12" height="42" rx="5" fill="#8B6748"/>
    <circle cx="476" cy="280" r="26" fill="#6FA873"/>
    <circle cx="456" cy="296" r="16" fill="#7FB681"/>
    <circle cx="496" cy="296" r="16" fill="#639D68"/>
  </g>

  <!-- bushes -->
  <ellipse cx="176" cy="340" rx="30" ry="12" fill="#8FBF93"/>
  <ellipse cx="392" cy="342" rx="26" ry="11" fill="#8FBF93"/>

  <!-- school building -->
  <g>
    <rect x="168" y="188" width="224" height="154" fill="#F7F2E6"/>
    <polygon points="152,192 280,116 408,192" fill="#1E2A4E"/>
    <rect x="150" y="188" width="260" height="10" fill="#16203E"/>

    <!-- flag -->
    <line x1="280" y1="116" x2="280" y2="82" stroke="#33415E" stroke-width="4"/>
    <polygon points="280,84 312,93 280,102" fill="#E9A63B"/>

    <!-- clock -->
    <circle cx="280" cy="156" r="17" fill="#FFFFFF" stroke="#1E2A4E" stroke-width="4"/>
    <line x1="280" y1="156" x2="280" y2="145" stroke="#1E2A4E" stroke-width="3" stroke-linecap="round"/>
    <line x1="280" y1="156" x2="289" y2="161" stroke="#E9A63B" stroke-width="3" stroke-linecap="round"/>

    <!-- plaque with star -->
    <rect x="250" y="204" width="60" height="20" rx="7" fill="#FFFFFF" stroke="#E4DDCB"/>
    <path d="M280 208.5 l2 5 5.4 0.4 -4.1 3.3 1.3 5.1 -4.6 -2.8 -4.6 2.8 1.3 -5.1 -4.1 -3.3 5.4 -0.4 Z" fill="#E9A63B"/>

    <!-- windows -->
    <g fill="#FFFFFF" stroke="#1E2A4E" stroke-width="4">
      <rect x="188" y="234" width="42" height="46" rx="6"/>
      <rect x="330" y="234" width="42" height="46" rx="6"/>
      <rect x="188" y="292" width="42" height="46" rx="6"/>
      <rect x="330" y="292" width="42" height="46" rx="6"/>
    </g>
    <g stroke="#1E2A4E" stroke-width="3">
      <line x1="209" y1="234" x2="209" y2="280"/>
      <line x1="188" y1="257" x2="230" y2="257"/>
      <line x1="351" y1="234" x2="351" y2="280"/>
      <line x1="330" y1="257" x2="372" y2="257"/>
      <line x1="209" y1="292" x2="209" y2="338"/>
      <line x1="188" y1="315" x2="230" y2="315"/>
      <line x1="351" y1="292" x2="351" y2="338"/>
      <line x1="330" y1="315" x2="372" y2="315"/>
    </g>

    <!-- door -->
    <path d="M258 342 v-44 a22 22 0 0 1 44 0 v44 Z" fill="#1E2A4E"/>
    <circle cx="292" cy="320" r="2.8" fill="#E9A63B"/>
  </g>

  <!-- sparkles -->
  <g fill="#F0B03F">
    <path d="M74 130 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z"/>
    <path d="M494 240 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z"/>
    <path d="M134 188 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4 Z" opacity="0.7"/>
  </g>

  <!-- flowers -->
  <g>
    <circle cx="120" cy="420" r="4" fill="#E9A63B"/>
    <circle cx="142" cy="428" r="3" fill="#E9A63B"/>
    <circle cx="446" cy="422" r="4" fill="#E9A63B"/>
    <circle cx="466" cy="430" r="3" fill="#E9A63B"/>
    <circle cx="352" cy="424" r="4" fill="#C4576B"/>
    <circle cx="204" cy="426" r="3" fill="#C4576B"/>
  </g>
</svg>
