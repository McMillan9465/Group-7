<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" role="img" aria-labelledby="illTeacherTitle">
  <title id="illTeacherTitle">Illustration of a chalkboard on an easel with books and a pointer</title>
  <ellipse cx="130" cy="182" rx="100" ry="11" fill="#EAE4D6"/>

  <!-- easel legs -->
  <g stroke="#8B6748" stroke-width="9" stroke-linecap="round">
    <line x1="92" y1="132" x2="76" y2="180"/>
    <line x1="168" y1="132" x2="184" y2="180"/>
    <line x1="130" y1="132" x2="130" y2="172"/>
  </g>

  <!-- board -->
  <g>
    <rect x="50" y="28" width="160" height="110" rx="12" fill="#A97C50"/>
    <rect x="60" y="38" width="140" height="90" rx="8" fill="#22315C"/>
    <text x="78" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#FFF7E8">Aa Bb Cc</text>
    <path d="M78 94 q22 -8 44 0 t44 0" fill="none" stroke="#F0B03F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M196 58 l2.6 5.8 6.3 0.5 -4.8 4.2 1.5 6.1 -5.6 -3.4 -5.6 3.4 1.5 -6.1 -4.8 -4.2 6.3 -0.5 Z" fill="#F0B03F"/>
    <!-- chalk tray -->
    <rect x="66" y="128" width="128" height="9" rx="4.5" fill="#8B6748"/>
    <rect x="84" y="122" width="22" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="150" y="122" width="16" height="6" rx="3" fill="#F0B03F"/>
  </g>

  <!-- pointer -->
  <g>
    <line x1="212" y1="58" x2="234" y2="168" stroke="#A97C50" stroke-width="6" stroke-linecap="round"/>
    <circle cx="211" cy="54" r="6" fill="#F0B03F"/>
  </g>

  <!-- books at the base -->
  <g>
    <rect x="196" y="168" width="52" height="11" rx="3" fill="#1E2A4E"/>
    <rect x="202" y="157" width="42" height="11" rx="3" fill="#2E7D5B"/>
  </g>

  <!-- star -->
  <path d="M38 150 l3 6.8 7.4 0.6 -5.6 4.9 1.7 7.2 -6.5 -3.9 -6.5 3.9 1.7 -7.2 -5.6 -4.9 7.4 -0.6 Z" fill="#F0B03F"/>
</svg>
