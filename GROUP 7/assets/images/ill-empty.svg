<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" role="img" aria-labelledby="illEmptyTitle">
  <title id="illEmptyTitle">Illustration of an open book with a magnifying glass</title>
  <ellipse cx="110" cy="140" rx="80" ry="9" fill="#EAE4D6"/>

  <!-- open book -->
  <g>
    <path d="M110 56 C92 42 62 40 42 48 L42 112 C62 104 92 106 110 120 Z" fill="#FFFFFF" stroke="#33415E" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M110 56 C128 42 158 40 178 48 L178 112 C158 104 128 106 110 120 Z" fill="#FFFFFF" stroke="#33415E" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="110" y1="56" x2="110" y2="120" stroke="#33415E" stroke-width="3.5"/>
    <g stroke="#C9CFDC" stroke-width="3" stroke-linecap="round">
      <line x1="56" y1="64" x2="96" y2="68"/>
      <line x1="56" y1="78" x2="96" y2="82"/>
      <line x1="56" y1="92" x2="88" y2="95"/>
      <line x1="124" y1="68" x2="164" y2="64"/>
      <line x1="124" y1="82" x2="164" y2="78"/>
      <line x1="124" y1="95" x2="152" y2="93"/>
    </g>
  </g>

  <!-- magnifier -->
  <g>
    <circle cx="158" cy="56" r="21" fill="#EAF2FB" stroke="#1E2A4E" stroke-width="6"/>
    <line x1="173" y1="71" x2="192" y2="90" stroke="#1E2A4E" stroke-width="8" stroke-linecap="round"/>
    <path d="M149 50 a11 11 0 0 1 9 -5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- stars -->
  <path d="M34 36 l3 6.8 7.4 0.6 -5.6 4.9 1.7 7.2 -6.5 -3.9 -6.5 3.9 1.7 -7.2 -5.6 -4.9 7.4 -0.6 Z" fill="#F0B03F"/>
  <path d="M186 112 l2.2 5 5.4 0.4 -4.1 3.6 1.2 5.2 -4.7 -2.8 -4.7 2.8 1.2 -5.2 -4.1 -3.6 5.4 -0.4 Z" fill="#F0B03F" opacity="0.75"/>
</svg>
